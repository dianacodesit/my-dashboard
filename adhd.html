<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ADHD / neurodiversity · diana's board</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css?v=navalign5"/>
<link rel="stylesheet" href="capture-page.css?v=nocream"/>
<style>
  .page-bg {
    background:
      linear-gradient(180deg, rgba(6,4,8,0.46) 0%, rgba(6,4,8,0.10) 46%, rgba(4,2,6,0.50) 100%),
      url("manus-storage/adhd-bg.jpg?v=revertcover") center 28%/cover no-repeat;
  }
  body.capture-page #hamburger-menu span { background: #f3e6d0; }
  body.adhd-page .page-shell {
    max-width: 1100px;
    width: 100%;
  }
  .adhd-sections {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: min(700px, 92%);
    margin: 0 auto 28px;
  }
  .adhd-section {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: #120a08;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
  }
  .adhd-section::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(12, 8, 4, 0.04) 22%, rgba(12, 8, 4, 0.42) 68%, rgba(12, 8, 4, 0.72) 100%);
    z-index: 1;
    pointer-events: none;
  }
  .adhd-section-photo {
    position: absolute;
    inset: 0;
    background-image: var(--section-photo);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: transform 0.45s ease;
  }
  .adhd-section:hover .adhd-section-photo {
    transform: scale(1.06);
  }
  .adhd-section-title {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 12px;
    margin: 0;
    z-index: 2;
    font-family: "Italiana", "Newsreader", Georgia, serif;
    font-size: clamp(15px, 1.7vw, 20px);
    font-weight: 400;
    font-style: normal;
    letter-spacing: 0.04em;
    line-height: 1.2;
    color: #fff8ee;
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.9),
      0 2px 10px rgba(0, 0, 0, 0.65),
      0 5px 22px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  @media (max-width: 720px) {
    .adhd-sections { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="capture-page adhd-page" data-store="page_adhd_v1" data-empty="nothing kept yet">
<div class="page-bg" aria-hidden="true"></div>
<main class="page-shell">
  <header class="hero">
    <h1>ADHD / neurodiversity</h1>
  </header>
  <div class="adhd-sections" aria-label="ADHD research sections">
    <article class="adhd-section" data-focus="pattern-recognition" style="--section-photo: url('manus-storage/adhd-section-pattern-recognition.jpg?v=1');">
      <div class="adhd-section-photo" aria-hidden="true"></div>
      <h2 class="adhd-section-title">pattern recognition</h2>
    </article>
    <article class="adhd-section" data-focus="psychological-reactance" style="--section-photo: url('manus-storage/adhd-section-psychological-reactance.jpg?v=1');">
      <div class="adhd-section-photo" aria-hidden="true"></div>
      <h2 class="adhd-section-title">psychological reactance</h2>
    </article>
  </div>
  <section class="panel">
    <div class="add-row">
      <input id="new-item" type="text" placeholder="a note about this mind" autocomplete="off"/>
      <button id="add-btn" type="button">keep</button>
    </div>
    <div id="list"></div>
    <p class="status" id="status">saved here</p>
  </section>
</main>
<script src="nav-shared.js?v=navdragfix1"></script>
<script src="capture-page.js?v=1"></script>
</body>
</html>
