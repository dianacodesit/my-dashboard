<script>window.__COPIED_CARD_NAMES = ["persons", "adderall", "capital blueprint", "social media", "glow up", "vibes", "litigation wins", "momentum", "UX Design", "workflow", "Frequency", "Power", "postal", "traveler", "returns", "pickups", "body", "Text Mom", "curated lifestyle", "leverage", "Elevate"];</script>
<script>
(function(){
  var START = '2026-08-25';
  var MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var WD = ['sun','mon','tue','wed','thu','fri','sat'];
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(){
    var t = new Date();
    return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
  }
  function labelFor(iso){
    var p = iso.split('-').map(Number);
    var t = new Date(p[0], p[1]-1, p[2]);
    return MONTHS[t.getMonth()] + ' ' + t.getDate() + ' · ' + WD[t.getDay()];
  }
  function isoAdd(iso, days){
    var p = iso.split('-').map(Number);
    var t = new Date(p[0], p[1]-1, p[2] + days);
    return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
  }
  function dayTemplate(iso, isToday){
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="day-block fmt22'+(isToday?' today-block':'')+'" data-date="'+iso+'"><div class="day-dot"></div><div class="day-card"><div class="day-card-header"><span class="day-date"></span></div><div class="today-view-toggle"><button class="tv-pill active" data-view="pursuits">pursuits</button><button class="tv-pill" data-view="flow">flow</button></div><div class="day-tasks"><div class="tv-panel tv-pursuits active"><div class="flow-chart-card"><div class="sec-grid freeform"></div></div></div><div class="tv-panel tv-flow" style="display:none"><div class="flow-chart-card"><p class="flow-title">flow</p></div></div></div></div></div>';
    var blk = wrap.firstElementChild;
    blk.querySelector('.day-date').textContent = labelFor(iso);
    return blk;
  }
  function rail(){
    return document.querySelector('#agendaBody > .timeline') || document.querySelector('.timeline');
  }
  function ensureRange(){
    var r = rail();
    if(!r) return;
    var iso = START;
    var last = todayStr();
    if(last < START) last = START;
    while(iso <= last){
      if(!document.querySelector('.day-block[data-date="'+iso+'"]')){
        var blk = dayTemplate(iso, iso === last);
        var days = Array.from(r.querySelectorAll(':scope > .day-block.fmt22[data-date]'));
        var placed = false;
        for(var i=0;i<days.length;i++){
          var d = days[i].getAttribute('data-date') || '';
          if(d > iso){
            r.insertBefore(blk, days[i]);
            placed = true;
            break;
          }
        }
        if(!placed) r.appendChild(blk);
      }
      var existing = document.querySelector('.day-block[data-date="'+iso+'"]');
      if(existing){
        existing.classList.toggle('today-block', iso === last);
        existing.classList.remove('past');
        if(iso < last) existing.classList.add('past');
      }
      iso = isoAdd(iso, 1);
    }
  }
  function wireDots(){
    document.querySelectorAll('.day-dot').forEach(function(dot){
      if(dot.dataset.wired) return;
      dot.dataset.wired = '1';
      dot.addEventListener('click', function(e){
        e.stopPropagation();
        var block = dot.closest('.day-block');
        if(!block) return;
        block.classList.toggle('collapsed');
        try{
          var key = 'agenda-collapsed-days';
          var set = new Set(JSON.parse(localStorage.getItem(key) || '[]'));
          var dateStr = block.getAttribute('data-date') || '';
          if(block.classList.contains('collapsed')) set.add(dateStr);
          else set.delete(dateStr);
          localStorage.setItem(key, JSON.stringify(Array.from(set)));
        }catch(err){}
      });
    });
    try{
      var collapsed = JSON.parse(localStorage.getItem('agenda-collapsed-days') || '[]');
      collapsed.forEach(function(d){
        var b = document.querySelector('.day-block[data-date="'+d+'"]');
        if(b && !b.classList.contains('today-block')) b.classList.add('collapsed');
      });
    }catch(err){}
  }
  document.addEventListener('click', function(e){
    var pill = e.target.closest('.tv-pill');
    if(!pill) return;
    var block = pill.closest('.day-block');
    if(!block) return;
    var view = pill.getAttribute('data-view');
    if(!view || view === 'agenda') return;
    e.preventDefault();
    block.querySelectorAll('.tv-pill').forEach(function(p){
      p.classList.toggle('active', p.getAttribute('data-view') === view);
    });
    block.querySelectorAll('.tv-panel').forEach(function(panel){
      var show = panel.classList.contains('tv-' + view);
      panel.style.display = show ? '' : 'none';
      panel.classList.toggle('active', show);
    });
  });

  var IMG = {

    'momentum':'manus-storage/pursuit-momentum-v13.jpg?v=work',
    'vibes':'manus-storage/pursuit-vibes_e645a2da.jpg',
    'ux design':'manus-storage/pursuit-ux-design-v12_f2f2c818.jpg',
    'persons':'manus-storage/pursuit-persons_be56f167.jpg',
    'text mom':'manus-storage/pursuit-persons_be56f167.jpg',
    'capital blueprint':'manus-storage/pursuit-money_57ff14e0.jpg',
    'glow up':'manus-storage/mock-glow-up-skin.jpg?v=1',
    'body':'manus-storage/zone-body.jpg?v=abs',

    'adderall / adhd meds':'manus-storage/pursuit-pharmacy-new_8ec4cd7a.jpg',

  };
  var THEMES = {
    'persons':'blush','text mom':'blush','capital blueprint':'amber','body':'blush','glow up':'blush',
    'shopped':'warm','returns':'warm','pickups':'warm','curated lifestyle':'warm','social media':'sage',
    'vibes':'lavender','adderall':'lavender','litigation wins':'sage','momentum':'coral','frequency':'coral',
    'ux design':'warm','workflow':'sage','postal':'warm','power':'amber','leverage':'warm','quantum':'lavender',
    'traveler':'warm','elevate':'coral'
  };
  var KEYWORDS = [
    [/translat|arabic/, 'manus-storage/pursuit-arabic-translation.jpg'],
    [/\bbody\b/, 'manus-storage/zone-body.jpg?v=abs'],
    [/person|\bmom\b|text/, 'manus-storage/pursuit-persons_be56f167.jpg'],
    [/money|capital|fund/, 'manus-storage/pursuit-money_57ff14e0.jpg'],
    [/glow|skin|beauty/, 'manus-storage/mock-glow-up-skin.jpg?v=1'],
    [/ux|design/, 'manus-storage/pursuit-ux-design-v12_f2f2c818.jpg'],
    [/leverage/, 'manus-storage/pursuit-leverage-v4.jpg?v=key'],
    [/work|flow/, 'manus-storage/pursuit-workflow-v6_6f889c15.jpg'],
    [/momentum/, 'manus-storage/pursuit-momentum-v13.jpg?v=work'],
    [/frequency/, 'manus-storage/pursuit-momentum-v5_f7c3e8ce.jpg'],
    [/vibe/, 'manus-storage/pursuit-vibes_e645a2da.jpg'],
    [/return/, 'manus-storage/pursuit-returns-v2.jpg'],
    [/pickup/, 'manus-storage/pursuit-pickups.jpg'],
    [/postal|mail/, 'manus-storage/pursuit-postal_v1_53e3e315.jpg'],
    [/pharmacy|adderall|meds/, 'manus-storage/pursuit-pharmacy-new_8ec4cd7a.jpg'],
    [/legal|litigat/, 'manus-storage/pursuit-legal_b70d3da7.jpg'],
    [/social/, 'manus-storage/pursuit-social-media-v7_c5f03b96.jpg'],
    [/travel/, 'manus-storage/pursuit-travel.jpg'],
    [/power/, 'manus-storage/mock-power.jpg'],
    [/shop|lifestyle|curat/, 'manus-storage/pursuit-curated-lifestyle.jpg?v=2']
  ];
  function resolveImg(name){
    var n = (name||'').trim().toLowerCase();
    if(IMG[n]) return IMG[n];
    for(var i=0;i<KEYWORDS.length;i++){ if(KEYWORDS[i][0].test(n)) return KEYWORDS[i][1]; }
    return 'manus-storage/pursuit-lifestyle_577937e8.jpg';
  }
  function resolveTheme(name){
    var n = (name||'').trim().toLowerCase();
    if(THEMES[n]) return THEMES[n];
    if(/power|money|capital/.test(n)) return 'amber';
    if(/person|glow|beauty|skin|mom|body/.test(n)) return 'blush';
    if(/legal|social|work/.test(n)) return 'sage';
    if(/vibe|med|adderall/.test(n)) return 'lavender';
    if(/moment|frequency|elevate/.test(n)) return 'coral';
    return 'warm';
  }
  window.__secImgFor = resolveImg;
  window.__secThemeFor = resolveTheme;
  var CARD_NAMES = window.__COPIED_CARD_NAMES || [];
  var SECTION_NAMES = ['GLOW UP','LIFESTYLE','FINANCES','POWER','AMBITION','QUANTUM'];
  var ZONE_LC = { 'glow up':1,'lifestyle':1,'finances':1,'power':1,'ambition':1,'quantum':1 };
  var SECTION_BY_ZONE={body:'GLOW UP', life:'LIFESTYLE', finances:'FINANCES', leverage:'POWER', ambition:'AMBITION', presence:'QUANTUM'};
  var CARD_SECTION={
    body:'GLOW UP','text mom':'GLOW UP',adderall:'GLOW UP',
    'curated lifestyle':'LIFESTYLE',persons:'LIFESTYLE','social media':'LIFESTYLE',vibes:'LIFESTYLE',
    postal:'LIFESTYLE',traveler:'LIFESTYLE',returns:'LIFESTYLE',pickups:'LIFESTYLE',shopped:'LIFESTYLE',
    'capital blueprint':'FINANCES',
    'litigation wins':'POWER',leverage:'POWER',workflow:'POWER',
    momentum:'AMBITION','ux design':'AMBITION',frequency:'AMBITION',elevate:'AMBITION',
    'document translation into arabic':'AMBITION'
  };
  function isSectionCard(name){
    return !!ZONE_LC[String(name||'').trim().toLowerCase()];
  }
  function isOneoffName(name){
    var n=String(name||'').trim().toLowerCase();
    if(!n || /elevate/.test(n)) return false;
    return /document translation|translat.*arabic/.test(n);
  }
  function sectionForCard(name){
    var n=(name||'').trim().toLowerCase();
    if(CARD_SECTION[n]) return CARD_SECTION[n];
    if(n==='power'||n==='leverage') return 'POWER';
    if(n==='quantum') return 'QUANTUM';
    if(n==='body'||n==='glow up'||n==='adderall') return 'GLOW UP';
    if(/capital|money|finance/.test(n)) return 'FINANCES';
    if(/litigat|legal|workflow|leverage/.test(n)) return 'POWER';
    if(/momentum|ux|frequency|betty|elevate|translat|arabic/.test(n)) return 'AMBITION';
    if(/quantum|entangle/.test(n)) return 'QUANTUM';
    if(/body|adderall|glow|skincare|mom/.test(n)) return 'GLOW UP';
    return inferSection(name) || 'LIFESTYLE';
  }
  var SECTION_KEYS = {
    'GLOW UP': /\b(glow\s*up|skincare|skin care|beauty|hair|halo|smile|pharmacy|meds|\brx\b|pill|qelbree|strattera|adderall|workout|gym|health|sleep|weight|body|dentist|vitamin|lotion|makeup|face|nails)\b/i,
    'LIFESTYLE': /\b(lifestyle|postal|\bmail\b|travel|luggage|flight|person|social|vibe|pickup|adhkar|quran|prayer|salah|family|friend|errand|home|house|apartment|grocer|clean|laundry|shop(?:ping|ped)?|\bbuy\b|bought|purchase|order|amazon|sephora|nordstrom|target|return|\bring\b|rings|jewel|necklace|earring|bracelet|watch|clothes|dress|shoes|bag|purse|hijab|abaya)\b/i,
    'FINANCES': /\b(capital|money|finance|fund|bank|tuition|rent|\bbill\b|vault|ledger|pay|paid|cash|tax|salary|budget|invoice|owe|venmo|zelle)\b/i,
    'POWER': /\b(litigat|legal|lawyer|court|letter|power|workflow|leverage|influence|contract|paperwork|notary|lawsuit|case)\b/i,
    'AMBITION': /\b(momentum|ux|design|frequency|betty|elevate|aera|research|translat|arabic|scholarship|musly|speech|handshake|proposal|career|anthropic|claude|job|school|study|deadline|portfolio|interview|resume|client|project)\b/i,
    'QUANTUM': /\b(quantum|superposition|entangle|particle|atom|manifest|journal|dream|meditat|intention)\b/i
  };
  function inferSection(name){
    var n = String(name||'');
    var best = '', bestScore = 0;
    SECTION_NAMES.forEach(function(sec){
      var re = SECTION_KEYS[sec];
      if(!re) return;
      var m = n.match(re);
      var score = m ? m.length : 0;
      if(score > bestScore){ best = sec; bestScore = score; }
    });
    return bestScore ? best : 'LIFESTYLE';
  }
  function groupCardsBySection(names){
    var groups={};
    SECTION_NAMES.forEach(function(s){ groups[s]=[]; });
    (names||[]).forEach(function(n){
      var s=sectionForCard(n);
      if(!groups[s]) groups[s]=[];
      groups[s].push(n);
    });
    return groups;
  }

  function makeCard(name){
    name = (name||'').trim();
    var theme = resolveTheme(name);
    var src = resolveImg(name);
    var sec = document.createElement('div');
    sec.className = 'j22-section card sec-card is-empty';
    sec.setAttribute('data-theme', theme);
    sec.innerHTML = '<div class="card-visual theme-'+theme+'"><img alt="" src=""><p class="j22-group" contenteditable="true" spellcheck="false"></p></div><div class="card-body"><div class="j22-section-items"></div></div><button type="button" class="card-add-task" aria-label="add task">+</button>';
    var img = sec.querySelector('img');
    img.alt = name; img.src = src;
    var g = sec.querySelector('.j22-group');
    g.setAttribute('data-newhdr', name);
    g.textContent = name;
    return sec;
  }
  function closePicker(){
    document.querySelectorAll('.sec-picker').forEach(function(el){ el.remove(); });
  }
  function cardNameOf(card){
    var g = card && card.querySelector('.j22-group');
    return g ? ((g.textContent||g.getAttribute('data-newhdr')||'').trim()) : '';
  }
  function cardsOnGrid(grid){
    return [].slice.call((grid||document).querySelectorAll(':scope > .sec-card')).map(function(card){
      return { card: card, name: cardNameOf(card) };
    }).filter(function(x){ return x.name && !isSectionCard(x.name); });
  }
  function oneoffText(el){
    var t = el && el.querySelector('.agenda-oneoff-t');
    return t ? (t.textContent||'').trim() : '';
  }
  function makeOneoff(name, section){
    name = (name||'').trim();
    var chip = document.createElement('div');
    chip.className = 'agenda-oneoff';
    if(section) chip.setAttribute('data-section', section);
    chip.innerHTML = '<img class="agenda-oneoff-img" alt=""><span class="agenda-oneoff-kicker">task</span><div class="agenda-oneoff-bar"><label class="agenda-oneoff-check"><input class="agenda-check" type="checkbox"></label><span class="agenda-oneoff-t" contenteditable="true" spellcheck="false"></span></div><button type="button" class="agenda-oneoff-del" aria-label="delete task">×</button>';
    var img = chip.querySelector('.agenda-oneoff-img');
    img.alt = name; img.src = resolveImg(name);
    chip.querySelector('.agenda-oneoff-t').textContent = name;
    return chip;
  }
  function lastInSection(grid, section){
    var last = null;
    [].slice.call(grid.children).forEach(function(n){
      if(n.classList.contains('agenda-oneoff')){
        if((n.getAttribute('data-section')||'') === section) last = n;
        return;
      }
      if(!n.classList.contains('sec-card')) return;
      var name = cardNameOf(n);
      if(!name) return;
      if(isSectionCard(name) && name.toUpperCase() === section) last = n;
      else if(!isSectionCard(name) && sectionForCard(name) === section) last = n;
    });
    return last;
  }
  function placeInSection(grid, el, section){
    if(section) el.setAttribute('data-section', section);
    var last = lastInSection(grid, section);
    if(last && last.nextSibling) grid.insertBefore(el, last.nextSibling);
    else if(last) grid.appendChild(el);
    else grid.appendChild(el);
  }
  function looksLikeOneoffCard(card){
    var name = cardNameOf(card);
    if(!name || isSectionCard(name)) return false;
    if(isOneoffName(name)) return true;
    var tasks = [].slice.call(card.querySelectorAll('.j22-section-items > .j22-item .j22-t'))
      .map(function(t){ return (t.textContent||'').trim().toLowerCase(); }).filter(Boolean);
    return tasks.length === 1 && tasks[0] === name.toLowerCase();
  }
  function convertOneoffCards(grid){
    if(!grid) return;
    [].slice.call(grid.querySelectorAll(':scope > .sec-card')).forEach(function(card){
      if(!looksLikeOneoffCard(card)) return;
      var name = cardNameOf(card);
      var section = sectionForCard(name);
      var chip = makeOneoff(name, section);
      var checked = card.querySelector('.agenda-check:checked');
      if(checked){
        chip.querySelector('.agenda-check').checked = true;
        chip.classList.add('is-done');
      }
      card.parentNode.insertBefore(chip, card);
      card.remove();
    });
  }
  function addTaskToCard(card, text, silent){
    if(!card) return;
    var box = card.querySelector('.j22-section-items');
    if(!box) return;
    var want = (text||'').trim() || 'new task';
    var have = [].slice.call(box.querySelectorAll('.j22-t')).some(function(el){
      return (el.textContent||'').trim().toLowerCase() === want.toLowerCase();
    });
    if(have) return;
    var lab = document.createElement('label');
    lab.className = 'j22-item';
    lab.innerHTML = '<input class="agenda-check" type="checkbox"><span class="j22-t" contenteditable="true" spellcheck="false"></span>';
    var t = lab.querySelector('.j22-t');
    t.textContent = want;
    box.appendChild(lab);
    card.classList.remove('is-empty');
    card.classList.add('has-tasks');
    if(!silent) t.focus();
    if(!silent) savePage();
    return t;
  }
  function splitDump(raw){
    var out = [];
    String(raw||'').split(/\r?\n+/).forEach(function(line){
      line = line.trim();
      if(!line) return;
      line.split(/\s*[•·]\s+/).forEach(function(bit){
        bit = bit.replace(/^[-*]\s+/, '').replace(/^\d+[.)]\s+/, '').trim();
        if(bit) out.push(bit);
      });
    });
    return out;
  }
  function knownCardName(line){
    var n = String(line||'').trim().toLowerCase();
    if(!n || isSectionCard(n)) return '';
    var names = CARD_NAMES.concat(Object.keys(CARD_SECTION));
    for(var i=0;i<names.length;i++){
      var c = names[i];
      if(String(c).toLowerCase()===n && !isSectionCard(c)) return c;
    }
    return '';
  }
  function innerTaskCard(line, grid){
    var n = String(line||'').trim().toLowerCase();
    if(/^(text\s+)?dr\.?\s*betty$|^text\s+betty$/.test(n)) return 'Elevate';
    if(/^text mom$/.test(n)) return 'Text Mom';
    var hit = '';
    cardsOnGrid(grid).forEach(function(x){
      var cn = String(x.name||'').trim();
      if(cn.length < 4) return;
      try{
        var re = new RegExp('\\b'+cn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
        if(re.test(line) && cn.length >= hit.length) hit = cn;
      }catch(e){}
    });
    return hit;
  }
  function findSectionEl(grid, section){
    return [].slice.call(grid.querySelectorAll(':scope > .sec-card')).filter(function(c){
      var name = cardNameOf(c);
      return isSectionCard(name) && name.toUpperCase() === section;
    })[0] || null;
  }
  function findCardEl(grid, name){
    var want = String(name||'').trim().toLowerCase();
    var hit = cardsOnGrid(grid).filter(function(x){ return x.name.toLowerCase()===want; })[0];
    return hit ? hit.card : null;
  }
  function oneoffExists(grid, name, section){
    var want = String(name||'').trim().toLowerCase();
    return [].slice.call(grid.querySelectorAll(':scope > .agenda-oneoff')).some(function(el){
      if(section && (el.getAttribute('data-section')||'') !== section) return false;
      return oneoffText(el).toLowerCase() === want;
    });
  }
  function ensureSection(grid, section){
    if(!section) return null;
    var el = findSectionEl(grid, section);
    if(el) return el;
    el = makeCard(section);
    el.classList.add('is-section');
    var idx = SECTION_NAMES.indexOf(section);
    var nextSec = null;
    for(var i=idx+1;i<SECTION_NAMES.length;i++){
      nextSec = findSectionEl(grid, SECTION_NAMES[i]);
      if(nextSec) break;
    }
    if(nextSec) grid.insertBefore(el, nextSec);
    else {
      var prev = null;
      for(var j=idx-1;j>=0;j--){
        prev = lastInSection(grid, SECTION_NAMES[j]);
        if(prev) break;
      }
      if(prev && prev.nextSibling) grid.insertBefore(el, prev.nextSibling);
      else if(prev) grid.appendChild(el);
      else grid.appendChild(el);
    }
    return el;
  }
  function ensureCard(grid, name, section){
    var el = findCardEl(grid, name);
    if(el) return el;
    ensureSection(grid, section);
    el = makeCard(name);
    placeInSection(grid, el, section);
    return el;
  }
  function dumpLine(grid, line){
    var text = String(line||'').trim();
    if(!text) return;
    if(isSectionCard(text)){
      var secName = SECTION_NAMES.filter(function(s){ return s.toLowerCase()===text.toLowerCase(); })[0];
      if(secName) ensureSection(grid, secName);
      return;
    }
    var cardName = knownCardName(text);
    if(cardName){
      var sec = sectionForCard(cardName);
      var card = ensureCard(grid, cardName, sec);
      if(/^elevate$/i.test(cardName)) addTaskToCard(card, 'text Dr Betty', true);
      return;
    }
    if(isOneoffName(text)){
      var offSec = sectionForCard(text);
      ensureSection(grid, offSec);
      if(!oneoffExists(grid, text, offSec)) placeInSection(grid, makeOneoff(text, offSec), offSec);
      return;
    }
    var hostName = innerTaskCard(text, grid);
    if(hostName){
      var hostSec = sectionForCard(hostName);
      var host = ensureCard(grid, hostName, hostSec);
      addTaskToCard(host, text, true);
      return;
    }
    var dest = inferSection(text);
    ensureSection(grid, dest);
    if(!oneoffExists(grid, text, dest)) placeInSection(grid, makeOneoff(text, dest), dest);
  }
  function commitDump(blk){
    var ta = blk && blk.querySelector('.agenda-dump-input');
    var grid = blk && (blk.querySelector('.tv-pursuits .sec-grid') || blk.querySelector('.sec-grid'));
    if(!ta || !grid) return;
    var lines = splitDump(ta.value);
    if(!lines.length) return;
    lines.forEach(function(line){ dumpLine(grid, line); });
    ta.value = '';
    normalizeCards(blk);
    savePage();
    var note = blk.querySelector('.agenda-dump-status');
    if(note){
      note.textContent = 'sorted '+lines.length+(lines.length===1?' item':' items');
      setTimeout(function(){ if(note.textContent.indexOf('sorted')===0) note.textContent = ''; }, 2400);
    }
  }
  function ensureDump(blk){
    if(!blk || blk.classList.contains('dimensions-host') || blk.classList.contains('grids-host')) return;
    var panel = blk.querySelector('.tv-pursuits');
    if(!panel) return;
    if(panel.querySelector('.agenda-dump')) return;
    var box = document.createElement('div');
    box.className = 'agenda-dump';
    box.innerHTML = '<p class="agenda-dump-label">brain dump</p><textarea class="agenda-dump-input" rows="3" placeholder="one thing per line — they’ll land in a section, a card, or a task"></textarea><div class="agenda-dump-row"><button type="button" class="agenda-dump-go">sort onto this day</button><span class="agenda-dump-status"></span></div>';
    var row = panel.querySelector('.add-board-row');
    if(row && row.nextSibling) panel.insertBefore(box, row.nextSibling);
    else if(row) panel.appendChild(box);
    else {
      var chart = panel.querySelector('.flow-chart-card');
      if(chart) panel.insertBefore(box, chart);
      else panel.insertBefore(box, panel.firstChild);
    }
    var go = box.querySelector('.agenda-dump-go');
    var ta = box.querySelector('.agenda-dump-input');
    go.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      commitDump(blk);
    });
    ta.addEventListener('keydown', function(e){
      if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
        e.preventDefault();
        commitDump(blk);
      }
    });
  }
  function openPicker(anchor, grid, kind){
    closePicker();
    var box = document.createElement('div');
    box.className = 'sec-picker';
    var lab = document.createElement('p');
    lab.className = 'sec-picker-label';
    lab.textContent = kind === 'section' ? 'new section' : kind === 'task' ? 'new task' : 'new card';
    box.appendChild(lab);
    var list = document.createElement('div');
    list.className = 'sec-picker-list';
    var row = document.createElement('div');
    row.className = 'sec-picker-new';
    var inp = document.createElement('input');
    inp.className = 'plus-name-input';
    inp.type = 'text';
    inp.setAttribute('autocomplete','off');
    var go = document.createElement('button');
    go.type = 'button';
    go.textContent = 'add';

    if(kind === 'task'){
      var onDay = cardsOnGrid(grid);
      function addTaskOpt(name){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sec-picker-opt';
        b.textContent = name;
        b.addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var dest = byName[name.toLowerCase()];
          var v = (inp.value||'').trim();
          closePicker();
          addTaskToCard(dest, v);
        });
        list.appendChild(b);
      }
      function addOneoffOpt(sec){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sec-picker-opt is-oneoff-dest';
        b.textContent = sec;
        b.addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var v = (inp.value||'').trim();
          if(!v) return;
          closePicker();
          placeInSection(grid, makeOneoff(v, sec), sec);
          savePage();
        });
        list.appendChild(b);
      }
      if(onDay.length){
        var groups = groupCardsBySection(onDay.map(function(x){ return x.name; }));
        var byName = {};
        onDay.forEach(function(x){ byName[x.name.toLowerCase()] = x.card; });
        var h1 = document.createElement('p');
        h1.className = 'sec-picker-group';
        h1.textContent = 'inside a card';
        list.appendChild(h1);
        SECTION_NAMES.forEach(function(sec){
          var items = groups[sec] || [];
          if(!items.length) return;
          var h = document.createElement('p');
          h.className = 'sec-picker-group';
          h.textContent = sec;
          list.appendChild(h);
          items.forEach(addTaskOpt);
        });
      }
      var h2 = document.createElement('p');
      h2.className = 'sec-picker-group';
      h2.textContent = 'as its own task';
      list.appendChild(h2);
      SECTION_NAMES.forEach(addOneoffOpt);
      box.appendChild(list);
      inp.placeholder = 'type a task, then pick where it goes';
      function submitTask(){
        var v = (inp.value||'').trim();
        if(!v) return;
        var only = cardsOnGrid(grid);
        if(only.length === 1){
          closePicker();
          addTaskToCard(only[0].card, v);
          return;
        }
      }
      go.addEventListener('click', submitTask);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submitTask(); });
    } else {
      var names = kind === 'section' ? SECTION_NAMES : CARD_NAMES.filter(function(n){ return !ZONE_LC[n.toLowerCase()] && !isOneoffName(n); });
      function addOpt(name){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sec-picker-opt';
        b.textContent = name;
        b.addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          closePicker();
          if(kind === 'card' && isOneoffName(name)){
            placeInSection(grid, makeOneoff(name, sectionForCard(name)), sectionForCard(name));
            savePage();
            return;
          }
          grid.appendChild(makeCard(name));
          savePage();
        });
        list.appendChild(b);
      }
      if(kind === 'card'){
        var groups = groupCardsBySection(names);
        SECTION_NAMES.forEach(function(sec){
          var items = groups[sec] || [];
          if(!items.length) return;
          var h = document.createElement('p');
          h.className = 'sec-picker-group';
          h.textContent = sec;
          list.appendChild(h);
          items.forEach(addOpt);
        });
      } else {
        names.forEach(addOpt);
      }
      box.appendChild(list);
      inp.placeholder = kind === 'section' ? 'type a new section name' : 'type a new card';
      function submit(){
        var v = (inp.value||'').trim();
        if(!v) return;
        closePicker();
        if(kind === 'card' && isOneoffName(v)){
          placeInSection(grid, makeOneoff(v, sectionForCard(v)), sectionForCard(v));
        } else {
          grid.appendChild(makeCard(v));
        }
        savePage();
      }
      go.addEventListener('click', submit);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
    }
    row.appendChild(inp); row.appendChild(go);
    box.appendChild(row);
    if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(box, anchor.nextSibling);
    inp.focus();
  }
  function ensureBtns(){
    document.querySelectorAll('.day-block.fmt22').forEach(function(blk){
      if(blk.classList.contains('dimensions-host') || blk.classList.contains('grids-host')) return;
      var grid = blk.querySelector('.tv-pursuits .sec-grid') || blk.querySelector('.sec-grid');
      if(!grid) return;
      function mk(cls, text, kind){
        var b = document.createElement('button');
        b.className = cls; b.type = 'button'; b.textContent = text;
        b.addEventListener('click', function(e){
          e.stopPropagation(); e.preventDefault();
          openPicker(row, grid, kind);
        });
        return b;
      }
      var row = blk.querySelector('.add-board-row');
      if(row){
        if(!row.querySelector('.add-task-day-btn')) row.appendChild(mk('add-task-day-btn','+ task','task'));
        ensureDump(blk);
        return;
      }
      row = document.createElement('div');
      row.className = 'add-board-row';
      row.appendChild(mk('add-grid','+ section','section'));
      row.appendChild(mk('add-card-btn','+ card','card'));
      row.appendChild(mk('add-task-day-btn','+ task','task'));
      var panel = blk.querySelector('.tv-pursuits');
      if(panel){
        var chart = panel.querySelector('.flow-chart-card');
        if(chart) panel.insertBefore(row, chart);
        else panel.insertBefore(row, panel.firstChild);
      } else if(grid.parentNode){
        grid.parentNode.insertBefore(row, grid);
      }
      ensureDump(blk);
    });
  }
  var SAVE_KEY = document.body.getAttribute('data-save-key') || 'agenda_page_v1';
  function savePage(){
    if(SAVE_KEY === 'agenda_page_v1'){
      var days = {};
      document.querySelectorAll('.day-block.fmt22[data-date]').forEach(function(blk){
        var g = blk.querySelector('.sec-grid');
        days[blk.getAttribute('data-date')] = g ? g.innerHTML : '';
      });
      try{ localStorage.setItem(SAVE_KEY, JSON.stringify(days)); }catch(e){}
    } else {
      var grid = document.getElementById('dimGrid');
      if(!grid) return;
      try{ localStorage.setItem(SAVE_KEY, grid.innerHTML); }catch(e){}
    }
  }
  function restorePage(){
    try{
      if(SAVE_KEY === 'agenda_page_v1'){
        var days = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
        Object.keys(days).forEach(function(iso){
          var blk = document.querySelector('.day-block[data-date="'+iso+'"]');
          var g = blk && blk.querySelector('.sec-grid');
          if(g && days[iso]) g.innerHTML = days[iso];
        });
      } else {
        var html = localStorage.getItem(SAVE_KEY);
        var grid = document.getElementById('dimGrid');
        if(html && grid) grid.innerHTML = html;
      }
    }catch(e){}
  }
  document.addEventListener('click', function(e){
    if(e.target.closest('.sec-picker, .add-grid, .add-card-btn, .add-task-day-btn, .add-board-row, .agenda-dump')) return;
    closePicker();
  });
  document.addEventListener('click', function(e){
    var del = e.target.closest('.agenda-oneoff-del');
    if(del){
      e.preventDefault();
      var chip = del.closest('.agenda-oneoff');
      if(chip) chip.remove();
      savePage();
      return;
    }
    var add = e.target.closest('.card-add-task');
    if(!add) return;
    addTaskToCard(add.closest('.sec-card'), 'new task');
  });
  document.addEventListener('change', function(e){
    var ck = e.target.closest('.agenda-oneoff .agenda-check');
    if(!ck) return;
    var chip = ck.closest('.agenda-oneoff');
    if(chip) chip.classList.toggle('is-done', ck.checked);
  });
  document.addEventListener('input', savePage);
  document.addEventListener('change', savePage);

  function normalizeCards(root){
    (root||document).querySelectorAll('.sec-grid').forEach(convertOneoffCards);
    (root||document).querySelectorAll('.sec-card').forEach(function(card){
      var vis = card.querySelector('.card-visual');
      var group = card.querySelector('.j22-group');
      if(vis && group && group.parentElement !== vis) vis.appendChild(group);
      var img = vis && vis.querySelector('img');
      var name = group ? (group.getAttribute('data-newhdr')||group.textContent||'').trim() : '';
      if(img && name && !img.getAttribute('src')) img.src = resolveImg(name);
      if(name){
        var theme = resolveTheme(name);
        card.setAttribute('data-theme', theme);
        if(vis) vis.className = 'card-visual theme-' + theme;
        card.classList.toggle('is-section', isSectionCard(name));
      }
    });
  }
  function boot(){
    if(document.body.classList.contains('agenda-copy-page')){
      ensureRange();
    }
    restorePage();
    normalizeCards();
    ensureBtns();
    document.querySelectorAll('.day-block.fmt22').forEach(ensureDump);
    wireDots();
    var dimAdd = document.getElementById('dimAddCard');
    if(dimAdd){
      dimAdd.addEventListener('click', function(e){
        e.preventDefault();
        var grid = document.getElementById('dimGrid');
        openPicker(dimAdd, grid, 'card');
      });
    }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
