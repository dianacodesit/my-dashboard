<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    background: #1c140e;
    color: #f7efe4;
    min-height: 100vh;
    padding: 64px 20px 80px;
  }
  body #hamburger-menu span { background: #f3e6d0; }
  .hero {
    text-align: center;
    max-width: 640px;
    margin: 0 auto 12px;
  }
  .hero h1 {
    font-family: "Italiana", serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 400;
    color: #fff8ee;
  }
  .hero p {
    margin-top: 10px;
    font-family: "DM Mono", monospace;

    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(247,239,228,0.72);
    line-height: 1.7;
  }
  .note {
    max-width: 640px;
    margin: 0 auto 32px;
    text-align: center;
    font-style: italic;
    color: rgba(247,239,228,0.62);
    font-size: 1rem;
    line-height: 1.55;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
    max-width: 920px;
    margin: 0 auto;
  }
  figure {
    background: rgba(250,246,238,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    overflow: hidden;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }
  figcaption {
    padding: 14px 18px 16px;
  }
  figcaption strong {
    display: block;
    font-family: "Italiana", serif;
    font-size: 1.35rem;
    font-weight: 400;
    color: #fff8ee;
    margin-bottom: 4px;
  }
  figcaption span {
    display: block;
    font-size: 1rem;
    font-style: italic;
    color: rgba(247,239,228,0.78);
    margin-bottom: 6px;
  }
  figcaption em {
    display: block;
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(247,239,228,0.5);
    font-style: normal;
  }
  details.archive {
    max-width: 920px;
    margin: 36px auto 0;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 0 16px;
    background: rgba(250,246,238,0.03);

    padding: 14px 4px;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(247,239,228,0.55);

  .back {

    text-align: center;
    margin-top: 40px;
