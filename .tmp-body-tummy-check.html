<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;background:#12100e;height:100%}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px;height:100vh;box-sizing:border-box}
.box{position:relative;overflow:hidden;border-radius:12px;background:#060504}
.tile{height:220px}.zoom{min-height:calc(100vh - 32px)}
.tile .p{position:absolute;inset:0;background:#060504 center/cover no-repeat url('manus-storage/zone-body-tummy-gym-dark.jpg?v=tummygym6')}
.zoom .p{position:absolute;inset:0;background:#060504 center/contain no-repeat url('manus-storage/zone-body-tummy-gym-dark.jpg?v=tummygym6')}
.q{position:absolute;left:16px;z-index:2;margin:0;color:#fff8ee;font:italic 500 20px Georgia,serif;text-shadow:0 2px 10px #000;max-width:26em}
.t{position:absolute;left:16px;z-index:2;margin:0;color:#fff8ee;font:italic 600 36px Georgia,serif;text-shadow:0 2px 10px #000}
.tile .q{bottom:44px;font-size:13px}.tile .t{bottom:10px;font-size:26px}
.zoom .q{top:52px}.zoom .t{top:96px}
</style></head><body><div class="wrap">
<div class="box tile"><div class="p"></div><p class="q">obsessed is a word the lazy use to describe the dedicated.</p><h3 class="t">body</h3></div>
<div class="box zoom" id="z"><div class="p"></div><p class="q">obsessed is a word the lazy use to describe the dedicated.</p><h3 class="t">body</h3></div>
</div></body></html>
