<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Curriculum Vitae · diana's board</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css?v=navveil5"/>
<link rel="stylesheet" href="capture-page.css?v=nocream"/>
<style>
  .page-bg {
    background:
      linear-gradient(180deg, rgba(12,8,6,0.18) 0%, rgba(12,8,6,0.05) 38%, rgba(12,8,6,0.42) 100%),
      url("manus-storage/curriculum-vitae-real.jpg?v=cv10") center 18%/cover no-repeat;
  }
  body.capture-page #hamburger-menu span { background: #f3e6d0; }
  /* CV photo is the title — no competing hero overlay */
  body.capture-page .hero { display: none; }
  body.capture-page .page-shell {
    padding: 56px 20px 28px;
    justify-content: flex-end;
    min-height: 100vh;
  }
  body.capture-page .panel {
    width: min(420px, calc(100% - 24px));
    margin-top: auto;
    margin-bottom: 10px;
    padding: 10px 14px 8px;
    border-radius: 16px;
    background: rgba(20, 12, 8, 0.38);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  body.capture-page .add-row input {
    font-size: 15px;
    padding: 6px 0;
  }
  body.capture-page .empty,
  body.capture-page .status {
    font-size: 13px;
    opacity: 0.75;
  }
</style>
</head>
<body class="capture-page" data-store="page_cv_v1" data-empty="nothing drafted yet">
<div class="page-bg" aria-hidden="true"></div>
<main class="page-shell">
  <section class="panel">
    <div class="add-row">
      <input id="new-item" type="text" placeholder="a line for the CV" autocomplete="off"/>
      <button id="add-btn" type="button">keep</button>
    </div>
    <div id="list"></div>
    <p class="status" id="status">saved here</p>
  </section>
</main>
<script src="nav-shared.js?v=navdragfix1"></script>
<script src="capture-page.js?v=1"></script>
</body>
</html>
