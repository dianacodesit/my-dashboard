<div class="page-bg" aria-hidden="true"></div>

<main class="page-shell">
  <header class="dump-hero">
    <p class="dump-eyebrow">one thought · one popup</p>
    <h1>brain dump</h1>
    <p class="dump-sub">sorted from the words · saved in this page</p>
    <p id="save-status">saved in this page</p>
  </header>
  <p class="dump-empty" id="dump-empty">nothing here yet — type a thought below</p>
  <div class="dump-board" id="dump-board"></div>
</main>

<form class="composer-dock" id="dump-form" autocomplete="off">
  <div class="composer">
    <textarea id="dump-input" rows="1" placeholder="one thought — enter to drop it as a popup"></textarea>
    <button class="dump-send" type="submit">drop</button>
  </div>
</form>

<script src="nav-shared.js"></script>
<script>
(function(){
  var SECTION_META = [
    { id:'body', title:'glow up' },
    { id:'life', title:'lifestyle' },
    { id:'shopping', title:'shopping' },
    { id:'finances', title:'finances' },
    { id:'leverage', title:'power' },
    { id:'ambition', title:'ambition' },
    { id:'presence', title:'quantum' },
    { id:'inbox', title:'unsorted' }
  ];
  var RANK = { ambition:6, finances:5, shopping:4, leverage:3, body:2, presence:2, life:1, inbox:0 };
  var KEYS = {
    body: /\b(glow\s*up|skincare|skin care|beauty|hair|halo|smile|pharmacy|meds|\brx\b|pill|qelbree|strattera|adderall|workout|gym|health|sleep|food|eat|weight|body|dentist|doctor(?!\s+betty)|vitamin|lotion|makeup|face|nails)\b/gi,
    life: /\b(lifestyle|postal|\bmail\b|travel|luggage|flight|person|social|vibe|pickup|adhkar|quran|prayer|salah|fajr|mom|dad|family|friend|errand|home|house|apartment|grocer|clean|laundry|call\s+mom|text\s+mom)\b/gi,
    shopping: /\b(shop(?:ping|ped)?|\bbuy\b|bought|purchase|order|amazon|sephora|nordstrom|target|return|\bring\b|rings|jewel(?:ry|lery)|necklace|earring|bracelet|watch|clothes|clothing|dress(?:es)?|shoes|bag|purse|cart|wishlist|store|retail|haul|wardrobe|outfit|hijab|abaya)\b/gi,
    finances: /\b(capital|money|finance|fund|bank|tuition|rent|\bbill\b|vault|ledger|pay|paid|cash|tax|salary|budget|invoice|owe|owed|venmo|zelle)\b/gi,
    leverage: /\b(litigat|legal|lawyer|court|letter|power|workflow|leverage|influence|contract|paperwork|notary|lawsuit|case)\b/gi,
    ambition: /\b(momentum|ux|design|frequency|betty|elevate|aera|research|translat\w*|arabic|scholarship|musly|speech|handshake|proposal|career|anthropic|claude|job|work|school|study|class|deadline|portfolio|interview|resume|cv|vitae|cover\s*letter|counsel\w*|naufar|pepperdine|client|project)\b/gi,
    presence: /\b(quantum|superposition|entangle|particle|atom|manifest|journal|dream|energy|spirit|meditat|intention)\b/gi
  };

  function categorize(text){
    var n = String(text || '').toLowerCase();
    if (!n.trim()) return 'inbox';
    var best = 'inbox', bestScore = 0, bestRank = 0;
    Object.keys(KEYS).forEach(function(id){
      var m = n.match(KEYS[id]);
      var score = m ? m.length : 0;
      var rank = RANK[id] || 0;
      if (score > bestScore || (score === bestScore && score > 0 && rank > bestRank)) {
        best = id;
        bestScore = score;
        bestRank = rank;
      }
    });
    return bestScore ? best : 'inbox';
  }

  function splitThoughts(raw){
    var out = [];
    String(raw || '').split(/\r?\n+/).forEach(function(line){
      line = line.trim();
      if (!line) return;
      line.split(/\s*[•·]\s+/).forEach(function(bit){
        bit = bit.replace(/^[-*]\s+/, '').replace(/^\d+[.)]\s+/, '').trim();
        if (bit) out.push(bit);
      });
    });
    return out;
  }

  function uid(){
    return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }
  function tiltFor(id){
    var n = 0;
    String(id).split('').forEach(function(c){ n = (n * 31 + c.charCodeAt(0)) % 17; });
    return ((n - 8) * 0.38).toFixed(2) + 'deg';
  }
  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }

  var dataEl = document.getElementById('brain-dump-data');
  var board = document.getElementById('dump-board');
  var emptyEl = document.getElementById('dump-empty');
  var statusEl = document.getElementById('save-status');
  var form = document.getElementById('dump-form');
  var input = document.getElementById('dump-input');
  var entries = [];
  var saveTimer;

  try { entries = JSON.parse((dataEl && dataEl.textContent) || '[]') || []; }
  catch (e) { entries = []; }
  if (!Array.isArray(entries)) entries = [];
  entries.forEach(function(e){
    if (!e || !e.text) return;
    e.section = categorize(e.text);
  });

  (function recoverOldDump(){
    var raw = '';
    try { raw = localStorage.getItem('brain_dump_v1') || ''; } catch (e) { raw = ''; }
    if (!raw.trim()) return;
    var have = {};
    entries.forEach(function(e){ have[String(e.text || '').trim().toLowerCase()] = 1; });
    var added = 0;
    splitThoughts(raw).forEach(function(text){
      if (have[text.toLowerCase()]) return;
      entries.push({
        id: uid(),
        text: text,
        section: categorize(text),
        at: new Date().toISOString()
      });
      have[text.toLowerCase()] = 1;
      added++;
    });
    if (added) {
      try { localStorage.removeItem('brain_dump_v1'); } catch (e) {}
    }
  })();

  function persist(){
    statusEl.textContent = 'saving…';
    var payload = JSON.stringify({ entries: entries });
    return fetch('/brain-dump', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload,
      cache: 'no-store'
    }).then(function(r){
      return r.json().then(function(j){
        if (!r.ok || !j.ok) throw new Error((j && j.error) || 'save failed');
        if (dataEl) dataEl.textContent = JSON.stringify(entries);
        statusEl.textContent = 'saved in this page';
      });
    }).catch(function(){
      statusEl.textContent = 'couldn’t save into the page — start the dashboard server';
    });
  }
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 180);
  }

  function render(){
    board.innerHTML = '';
    emptyEl.classList.toggle('show', !entries.length);
    SECTION_META.forEach(function(sec){
      var items = entries.filter(function(e){ return e.section === sec.id; });
      var cluster = document.createElement('section');
      cluster.className = 'cluster' + (items.length ? '' : ' is-empty');
      cluster.setAttribute('data-section', sec.id);
      cluster.innerHTML = '<h2 class="cluster-title">'+esc(sec.title)+'</h2><div class="cluster-notes"></div>';
      var hold = cluster.querySelector('.cluster-notes');
      items.forEach(function(item){
        var note = document.createElement('article');
        note.className = 'note';
        note.style.setProperty('--tilt', tiltFor(item.id));
        note.setAttribute('data-id', item.id);
        note.innerHTML =
          '<button class="note-x" type="button" aria-label="remove">×</button>' +
          '<div class="note-text" contenteditable="true" spellcheck="true">'+esc(item.text)+'</div>';
        hold.appendChild(note);
      });
      board.appendChild(cluster);
    });
  }

  function addThoughts(raw){
    var bits = splitThoughts(raw);
    if (!bits.length) return;
    bits.forEach(function(text){
      entries.push({
        id: uid(),
        text: text,
        section: categorize(text),
        at: new Date().toISOString()
      });
    });
    render();
    persist();
  }

  board.addEventListener('click', function(e){
    var note = e.target.closest('.note');
    if (!note) return;
    var id = note.getAttribute('data-id');
    var item = entries.filter(function(x){ return x.id === id; })[0];
    if (!item) return;
    if (e.target.classList.contains('note-x')) {
      entries = entries.filter(function(x){ return x.id !== id; });
      render();
      persist();
    }
  });

  board.addEventListener('focusout', function(e){
    if (!e.target.classList.contains('note-text')) return;
    var note = e.target.closest('.note');
    if (!note) return;
    var item = entries.filter(function(x){ return x.id === note.getAttribute('data-id'); })[0];
    if (!item) return;
    var next = (e.target.textContent || '').replace(/\s+/g, ' ').trim();
    if (!next) {
      entries = entries.filter(function(x){ return x.id !== item.id; });
      render();
      persist();
      return;
    }
    if (next === item.text) return;
    item.text = next;
    item.section = categorize(next);
    render();
    persist();
  });

  function grow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', grow);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var raw = input.value;
    input.value = '';
    grow();
    addThoughts(raw);
    input.focus();
  });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  render();
  if (entries.length) {
    statusEl.textContent = 'saved in this page';
    persist();
  }
})();
</script>
</body>
