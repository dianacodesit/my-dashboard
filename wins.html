<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>wins · diana's board</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,300;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css?v=navwins1"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body.wins-page {
    font-family: "Newsreader", Georgia, serif;
    color: #f7efe4;
    background: #100c08;
    overflow-x: hidden;
  }
  body.wins-page #hamburger-menu span { background: #f3e6d0; }

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(180deg, rgba(16,10,6,0.42) 0%, rgba(16,10,6,0.12) 38%, rgba(8,5,3,0.5) 100%),
      url("manus-storage/zone-wins.jpg?v=sec1") center 42%/cover no-repeat;
  }

  .page-shell {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 72px 20px 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero {
    text-align: center;
    max-width: 560px;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #f7efe4;
    margin-bottom: 8px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.55);
  }
  h1 {
    font-family: "Italiana", serif;
    font-size: clamp(40px, 8vw, 64px);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #fff8ee;
    text-shadow: 0 2px 22px rgba(8,4,2,0.55);
  }
  .sub {
    margin-top: 12px;
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 20px);
    line-height: 1.45;
    color: rgba(247,239,228,0.86);
    text-shadow: 0 1px 10px rgba(0,0,0,0.45);
  }
  .hint {
    margin-top: 8px;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(232,213,181,0.72);
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .wall-glass {
    width: min(1080px, 100%);
    padding: 22px 18px 20px;
    border-radius: 22px;
    border: 1px solid rgba(243,230,208,0.18);
    background: rgba(22,14,10,0.28);
    box-shadow: 0 24px 60px rgba(8,4,2,0.28);
    backdrop-filter: blur(10px) saturate(1.05);
    -webkit-backdrop-filter: blur(10px) saturate(1.05);
  }

  .wall {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 22px 18px;
    min-height: 220px;
    padding: 8px 4px 18px;
  }

  .vision-polaroid {
    position: relative;
    width: 176px;
    padding: 10px 10px 36px;
    background: #f6efe4;
    box-shadow: 0 14px 32px rgba(12, 8, 4, 0.38);
    transform: rotate(-2.8deg);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .vision-polaroid:nth-child(2n) { transform: rotate(2.4deg); }
  .vision-polaroid:nth-child(3n) { transform: rotate(-1.2deg); }
  .vision-polaroid:nth-child(4n) { transform: rotate(3.1deg); }
  .vision-polaroid:nth-child(5n) { transform: rotate(-3.4deg); }
  .vision-polaroid:hover { z-index: 3; transform: rotate(0deg) translateY(-4px); }
  .vision-polaroid img {
    display: block;
    width: 100%;
    height: 132px;
    object-fit: cover;
    background: #e8dcc8;
  }
  .vision-polaroid span {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 6px;
    font-family: "Cormorant Garamond", "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.02em;
    font-size: 18px;
    line-height: 1.1;
    color: #1a140e;
    text-align: center;
    outline: none;
  }
  .vision-polaroid .x {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 22px;
    height: 22px;
    border: 0;
    background: none;
    color: rgba(26,20,14,0.35);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
  }
  .vision-polaroid:hover .x { opacity: 1; }

  .empty {
    width: 100%;
    text-align: center;
    font-style: italic;
    color: rgba(247,239,228,0.7);
    padding: 28px 8px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .keep-row {
    display: flex;
    gap: 8px;
    max-width: 520px;
    margin: 4px auto 0;
  }
  .keep-row input {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.32);
    background: transparent;
    font-family: "Newsreader", serif;
    font-size: 18px;
    font-style: italic;
    color: #fff8ee;
    outline: none;
    text-shadow: 0 1px 8px rgba(8,4,2,0.55);
  }
  .keep-row input::placeholder { color: rgba(247,239,228,0.5); }
  .keep-row button {
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    background: transparent;
    color: #fff8ee;
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  .status {
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(247,239,228,0.5);
    text-align: center;
    margin-top: 12px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .win-lightbox {
    position: fixed;
    inset: 0;
    z-index: 190000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background: rgba(10,6,4,0.78);
    cursor: pointer;
  }
  .win-lightbox.is-open { display: flex; }
  .win-lightbox .shot {
    width: min(420px, 92vw);
    padding: 16px 16px 52px;
    background: #f6efe4;
    box-shadow: 0 28px 70px rgba(0,0,0,0.5);
    cursor: default;
  }
  .win-lightbox .shot img {
    display: block;
    width: 100%;
    height: min(52vh, 420px);
    object-fit: cover;
  }
  .win-lightbox .shot span {
    display: block;
    margin-top: 14px;
    font-family: "Cormorant Garamond", "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 26px;
    color: #1a140e;
    text-align: center;
  }

  @media (max-width: 640px) {
    .vision-polaroid { width: 154px; }
    .vision-polaroid img { height: 116px; }
    .vision-polaroid span { font-size: 16px; }
  }
</style>
</head>
<body class="wins-page">
<div class="page-bg" aria-hidden="true"></div>
<main class="page-shell">
  <header class="hero">
    <p class="eyebrow">captured · already · kept</p>
    <h1>wins</h1>
    <p class="sub">proof you already have — not open work sitting on the collage</p>
    <p class="hint">polaroids live here</p>
  </header>
  <section class="wall-glass">
    <div class="wall" id="wall" aria-label="captured wins"></div>
    <div class="keep-row">
      <input id="new-win" type="text" placeholder="a win already in hand" autocomplete="off"/>
      <button id="keep-btn" type="button">keep</button>
    </div>
    <p class="status" id="status">saved here</p>
  </section>
</main>
<div class="win-lightbox" id="lightbox" hidden>
  <div class="shot">
    <img id="lb-img" alt=""/>
    <span id="lb-cap"></span>
  </div>
</div>
<script src="nav-shared.js?v=navwins1"></script>
<script>
(function(){
  var KEY = 'page_wins_polaroids_v1';
  var PLAZA = /zone-wins|pursuit-pepperdine|zone-pepperdine/i;
  var KNOWN = {
    'psi chi': 'manus-storage/card-psi-chi.jpg',
    'ps chi': 'manus-storage/card-psi-chi.jpg',
    'refunds': 'manus-storage/card-refunds.jpg',
    'cleanse': 'manus-storage/card-cleanse.jpg',
    'induction': 'manus-storage/card-induction.jpg',
    'handshake': 'manus-storage/card-handshake.jpg',
    'top applicant': 'manus-storage/handshake-pepperdine-gsa.jpg',
    'gsa': 'manus-storage/handshake-pepperdine-gsa.jpg',
    'pepperdine gsa': 'manus-storage/handshake-pepperdine-gsa.jpg',
    'graduate student association': 'manus-storage/handshake-pepperdine-gsa.jpg',
    'graduate student association · top applicant': 'manus-storage/handshake-pepperdine-gsa.jpg',
    'committee check-in': 'manus-storage/pepperdine-committee-checkin.jpg',
    'enhancv': 'manus-storage/card-enhancv.jpg',
    'certified letters': 'manus-storage/card-certified-letters.jpg',
    'neighbor payment': 'manus-storage/card-neighbor-payment.jpg'
  };
  var SEED = [
    { t: 'Psi Chi', src: 'manus-storage/card-psi-chi.jpg' },
    { t: 'Graduate Student Association · Top Applicant', src: 'manus-storage/handshake-pepperdine-gsa.jpg' },
    { t: 'refunds', src: 'manus-storage/card-refunds.jpg' },
    { t: 'cleanse', src: 'manus-storage/card-cleanse.jpg' }
  ];

  var wall = document.getElementById('wall');
  var input = document.getElementById('new-win');
  var status = document.getElementById('status');
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbCap = document.getElementById('lb-cap');

  function norm(s){
    return String(s || '').replace(/\u2011/g, '-').replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function okSrc(src){
    src = String(src || '').trim();
    if (!src || PLAZA.test(src)) return '';
    return src;
  }
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw == null) return SEED.slice();
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : SEED.slice();
    } catch (e) {
      return SEED.slice();
    }
  }
  function save(items){
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
      if (status) status.textContent = 'saved here';
    } catch (e) {
      if (status) status.textContent = 'save failed';
    }
  }
  function openShot(it){
    if (!it) return;
    lbImg.src = it.src || '';
    lbImg.alt = it.t || '';
    lbCap.textContent = it.t || '';
    lb.hidden = false;
    lb.classList.add('is-open');
  }
  function closeShot(){
    lb.classList.remove('is-open');
    lb.hidden = true;
  }
  function render(){
    var items = load();
    wall.innerHTML = '';
    if (!items.length) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'no proof kept yet — this wall is for wins already in hand';
      wall.appendChild(empty);
      return;
    }
    items.forEach(function(it, i){
      var pol = document.createElement('div');
      pol.className = 'vision-polaroid';
      pol.innerHTML = '<img alt=""/><span contenteditable="true" spellcheck="false"></span><button class="x" type="button" aria-label="remove">×</button>';
      var img = pol.querySelector('img');
      var cap = pol.querySelector('span');
      img.src = it.src || '';
      img.alt = it.t || '';
      cap.textContent = it.t || '';
      pol.addEventListener('click', function(e){
        if (e.target.closest('.x') || e.target.closest('span')) return;
        openShot(it);
      });
      cap.addEventListener('blur', function(){
        var all = load();
        if (!all[i]) return;
        all[i].t = this.textContent.replace(/\s+/g, ' ').trim();
        save(all);
      });
      pol.querySelector('.x').addEventListener('click', function(e){
        e.stopPropagation();
        var all = load();
        all.splice(i, 1);
        save(all);
        render();
      });
      wall.appendChild(pol);
    });
  }
  function assignPhoto(title, done){
    var mapped = KNOWN[norm(title)];
    if (mapped) { done(mapped); return; }
    fetch('/photo-for?name=' + encodeURIComponent(title)).then(function(r){ return r.json(); }).then(function(j){
      var src = okSrc(j && j.src);
      if (src) { done(src); return; }
      done('');
    }).catch(function(){ done(''); });
  }
  function keep(){
    var t = (input.value || '').replace(/\s+/g, ' ').trim();
    if (!t) return;
    var all = load();
    var item = { t: t, src: KNOWN[norm(t)] || '' };
    all.unshift(item);
    save(all);
    input.value = '';
    render();
    if (item.src) return;
    assignPhoto(t, function(src){
      var next = load();
      var hit = next.find(function(x){ return x && x.t === t && !x.src; });
      if (!hit) return;
      hit.src = src;
      save(next);
      render();
    });
  }

  document.getElementById('keep-btn').addEventListener('click', keep);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); keep(); }
  });
  lb.addEventListener('click', function(e){
    if (e.target === lb) closeShot();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeShot();
  });
  render();
})();
</script>
</body>
</html>
