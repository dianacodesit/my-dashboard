<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>lifestyle · diana's board</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body.lifestyle-page {
    font-family: "Newsreader", Georgia, serif;
    color: #2a221c;
    background: #e8e0d4;
    overflow-x: hidden;
  }
  body.lifestyle-page #hamburger-menu span {
    background: #4a3d32;
    box-shadow: none;
  }
  .page-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(180deg, rgba(245,240,232,0.18) 0%, rgba(250,246,238,0.04) 42%, rgba(245,240,232,0.22) 100%),
      url("manus-storage/agenda-bg-wall.jpg?v=wall") center/cover no-repeat;
  }
  .page-shell {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 72px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero {
    text-align: center;
    margin-bottom: 28px;
    max-width: 560px;
  }
  .eyebrow {
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #6f5f54;
    margin-bottom: 8px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.55);
  }
  h1 {
    font-family: "Italiana", serif;
    font-size: clamp(40px, 8vw, 64px);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: #2a221c;
    text-shadow: 0 1px 0 rgba(255,255,255,0.55);
  }
  .sub {
    margin-top: 10px;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6f5f54;
  }
  .panel {
    width: min(640px, 100%);
    background: rgba(250,246,238,0.94);
    color: #1c140e;
    border-radius: 18px;
    padding: 22px 22px 18px;
    border: 1px solid rgba(196,168,130,0.35);
    box-shadow: 0 24px 60px rgba(90,70,40,0.18);
  }
  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .add-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid rgba(110,100,86,0.28);
    border-radius: 10px;
    background: #fffaf2;
    font-family: "Newsreader", serif;
    font-size: 16px;
    color: #1c140e;
    outline: none;
  }
  .add-row button {
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    background: #2a221c;
    color: #f7efe4;
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(196,168,130,0.18);
  }
  .item input[type=checkbox] { margin-top: 6px; }
  .item .t { flex: 1; font-size: 17px; line-height: 1.4; outline: none; }
  .item.done .t { opacity: 0.45; text-decoration: line-through; }
  .item .x { background: none; border: none; color: #a8706a; cursor: pointer; font-size: 16px; }
  .status {
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a7a6a;
    margin-top: 12px;
  }
</style>
</head>
<body class="lifestyle-page">
<div class="page-bg" aria-hidden="true"></div>
<main class="page-shell">
  <header class="hero">
    <p class="eyebrow">home · people · the way it looks</p>
    <h1>lifestyle</h1>
    <p class="sub">the room, not the schedule</p>
  </header>
  <section class="panel">
    <div class="add-row">
      <input id="new-item" type="text" placeholder="home, people, the way it looks" autocomplete="off"/>
      <button id="add-btn" type="button">add</button>
    </div>
    <div id="list"></div>
    <p class="status" id="status">saved here</p>
  </section>
</main>
<script src="nav-shared.js?v=timeblock"></script>
<script>
(function(){
  var KEY = 'page_lifestyle_v1';
  var listEl = document.getElementById('list');
  var input = document.getElementById('new-item');
  var status = document.getElementById('status');
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e){ return []; } }
  function save(items){
    try { localStorage.setItem(KEY, JSON.stringify(items)); status.textContent='saved here'; }
    catch(e){ status.textContent='save failed'; }
  }
  function render(){
    var items = load();
    listEl.innerHTML = '';
    items.forEach(function(it, i){
      var row = document.createElement('div');
      row.className = 'item' + (it.done ? ' done' : '');
      row.innerHTML = '<input type="checkbox"'+(it.done?' checked':'')+'><div class="t" contenteditable="true" spellcheck="false"></div><button class="x" type="button">×</button>';
      row.querySelector('.t').textContent = it.t || '';
      row.querySelector('input').addEventListener('change', function(){
        var all = load(); all[i].done = this.checked; save(all); render();
      });
      row.querySelector('.t').addEventListener('blur', function(){
        var all = load(); all[i].t = this.textContent.trim(); save(all);
      });
      row.querySelector('.x').addEventListener('click', function(){
        var all = load(); all.splice(i,1); save(all); render();
      });
      listEl.appendChild(row);
    });
  }
  function add(){
    var t = (input.value||'').trim(); if(!t) return;
    var all = load(); all.push({t:t, done:false}); save(all); input.value=''; render();
  }
  document.getElementById('add-btn').addEventListener('click', add);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  render();
})();
</script>
</body>
</html>
