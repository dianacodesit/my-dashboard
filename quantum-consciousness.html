<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>quantum consciousness · diana's board</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css?v=navveil5"/>
<link rel="stylesheet" href="capture-page.css?v=nocream"/>
<style>
  .page-bg {
    background-color: #040208;
    background-image: url("manus-storage/quantum-how-you-look.jpg?v=field-clean1");
    background-position: calc(50% + 56px) top;
    background-repeat: no-repeat;
    background-size: cover;
  }
  /* constellation lettering — sits in the SAVED HERE band above the field */
  .constellation-phrase {
    display: block;
    width: min(920px, 96vw);
    height: auto;
    margin: 10px auto 0;
    transform: translateX(-28px);
    pointer-events: none;
    user-select: none;
    opacity: 0.96;
  }
  body.capture-page #hamburger-menu span { background: #f3e6d0; }
</style>
</head>
<body class="capture-page" data-store="page_quantum_v1" data-empty="nothing observed yet">
<div class="page-bg" aria-hidden="true"></div>
<main class="page-shell">
  <header class="hero">
    <p class="eyebrow">field · observe · become</p>
    <h1>quantum consciousness</h1>
    <p class="sub">the unseen layer</p>
  </header>
  <section class="panel">
    <div class="add-row">
      <input id="new-item" type="text" placeholder="a note from the field" autocomplete="off"/>
      <button id="add-btn" type="button">keep</button>
    </div>
    <div id="list"></div>
    <p class="status" id="status">saved here</p>
    <img class="constellation-phrase" src="manus-storage/quantum-constellation-phrase.png?v=1" alt="HOW YOU LOOK CHANGES WHAT YOU FIND" width="920" height="76"/>
  </section>
</main>
<script src="nav-shared.js?v=navdragfix1"></script>
<script src="capture-page.js?v=1"></script>
</body>
</html>
