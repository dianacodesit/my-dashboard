<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>margin layout options · pick one</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;family=Reenie+Beanie&amp;family=Cormorant+Garamond:ital,wght@1,400&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css?v=navalign3"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Newsreader", Georgia, serif;
    background: #121014;
    color: #f4efe6;
    min-height: 100vh;
    padding: 56px 16px 96px;
  }
  body #hamburger-menu span { background: #f3e6d0; }
  .hero { text-align: center; max-width: 700px; margin: 0 auto 10px; }
  .hero h1 {
    font-family: "Italiana", serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
  }
  .hero p {
    margin-top: 10px;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
  }
  .note {
    max-width: 620px;
    margin: 0 auto 32px;
    text-align: center;
    font-style: italic;
    color: rgba(244,239,230,0.5);
    font-size: 1rem;
    line-height: 1.45;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
    max-width: 920px;
    margin: 0 auto;
  }
  figure {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
  }
  figcaption { padding: 14px 16px 16px; }
  figcaption .num {
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #c4a882;
    margin-bottom: 4px;
  }
  figcaption h2 {
    font-family: "Italiana", serif;
    font-size: 1.4rem;
    font-weight: 400;
  }
  figcaption p {
    margin-top: 6px;
    font-style: italic;
    font-size: 0.95rem;
    line-height: 1.4;
    color: rgba(244,239,230,0.55);
  }

  .stage {
    position: relative;
    padding: 16px;
    min-height: 240px;
    background:
      linear-gradient(180deg, rgba(20,12,10,0.45), rgba(20,12,10,0.65)),
      url("manus-storage/_339ab459.jpg") center/cover;
  }
  .board {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: 1fr 0.9fr;
    gap: 5px;
    height: 150px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .tile { position: relative; background-size: cover; background-position: center; }
  .tile span {
    position: absolute; left: 8px; bottom: 5px;
    font-style: italic; font-size: 12px; color: #fff;
    text-shadow: 0 1px 6px #000;
  }
  .tb { grid-row: 1/3; background-image: url("manus-storage/zone-body-tummy-gym-dark-abs.jpg?v=nolegs3"); }
  .tp { background-image: url("manus-storage/pursuit-pepperdine.jpg?v=fullbleed3"); }
  .tw { background-image: url("manus-storage/zone-power.jpg?v=agency1"); background: #111; }

  /* 1 Paper margin strip */
  .o1 .paper {
    margin-top: 10px;
    background: linear-gradient(180deg, #f7f1e6, #ebe3d4);
    color: #2a2218;
    border-radius: 2px;
    padding: 12px 14px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    border-top: 1px solid rgba(120,90,50,0.25);
  }
  .o1 .paper .rule {
    height: 1px;
    background: rgba(80,60,40,0.28);
    margin-bottom: 10px;
  }
  .o1 .paper i {
    display: block;
    font-family: "Reenie Beanie", cursive;
    font-size: 22px;
    line-height: 1.15;
    color: #1e1812;
    margin-bottom: 2px;
  }
  .o1 .paper .add {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(42,34,24,0.4);
    border-bottom: 1px solid rgba(80,60,40,0.2);
    margin-top: 6px;
    padding-bottom: 4px;
  }

  /* 2 Side book margin */
  .o2 .stage {
    display: flex;
    gap: 0;
    padding: 14px;
  }
  .o2 .board {
    flex: 1;
    height: 200px;
    border-radius: 10px 0 0 10px;
  }
  .o2 .gutter {
    width: 108px;
    flex: 0 0 108px;
    background: rgba(250,246,238,0.06);
    border-left: 1px solid rgba(212,184,140,0.65);
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    justify-content: flex-start;
  }
  .o2 .gutter i {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(255,248,238,0.9);
    line-height: 1.25;
    text-shadow: 0 0 12px rgba(255,236,210,0.2);
  }

  /* 3 Floating scrap lines */
  .o3 .stage { padding-bottom: 20px; }
  .o3 .scraps {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }
  .o3 .scrap {
    background: rgba(255,248,238,0.92);
    color: #2a2218;
    font-family: "Reenie Beanie", cursive;
    font-size: 20px;
    padding: 8px 14px 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    max-width: 88%;
  }
  .o3 .scrap:nth-child(1) { transform: rotate(-1.5deg); margin-left: 4%; }
  .o3 .scrap:nth-child(2) { transform: rotate(1.8deg); margin-left: 14%; background: rgba(255,252,245,0.88); }
  .o3 .scrap:nth-child(3) { transform: rotate(-0.8deg); margin-left: 8%; }
  .o3 .scrap::after {
    content: "";
    position: absolute;
  }

  /* 4 Hairline ledger */
  .o4 .ledger {
    margin-top: 12px;
    padding: 4px 2px 0;
  }
  .o4 .row {
    border-bottom: 1px solid rgba(255,248,238,0.28);
    padding: 7px 2px 8px;
    font-style: italic;
    font-size: 15px;
    color: rgba(255,252,245,0.95);
    text-shadow: 0 0 12px rgba(255,236,210,0.28);
  }
  .o4 .row.empty {
    color: rgba(255,248,238,0.32);
    text-shadow: none;
    min-height: 34px;
  }

  /* 5 Ghost until hover */
  .o5 .stage { overflow: hidden; }
  .o5 .ghost-zone {
    margin-top: 8px;
    min-height: 72px;
    border-radius: 8px;
    position: relative;
  }
  .o5 .ghost-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,248,238,0.22);
    transition: opacity 0.25s;
  }
  .o5 .ghost-lines {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.28s, transform 0.28s;
    padding: 10px 8px;
  }
  .o5 .ghost-lines i {
    display: block;
    font-style: italic;
    font-size: 14px;
    color: rgba(255,252,245,0.92);
    text-shadow: 0 0 14px rgba(255,236,210,0.35);
    margin-bottom: 5px;
  }
  .o5 .stage:hover .ghost-lines,
  .o5 .stage:focus-within .ghost-lines {
    opacity: 1;
    transform: translateY(0);
  }
  .o5 .stage:hover .ghost-hint,
  .o5 .stage:focus-within .ghost-hint {
    opacity: 0;
    pointer-events: none;
  }
  .o5 .hint-label {
    margin-top: 8px;
    font-family: "DM Mono", monospace;
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.35);
    text-align: center;
  }
</style>
</head>
<body>
  <header class="hero">
    <h1>margin layout options</h1>
    <p>five directions · stay in the margin</p>
  </header>
  <p class="note">Same collage. Five different ways the one-offs can live beside it. Hover option 5 to see the ghost reveal.</p>

  <div class="grid">
    <figure class="o1">
      <div class="stage">
        <div class="board">
          <div class="tile tb"><span>body</span></div>
          <div class="tile tp"><span>Pepperdine</span></div>
          <div class="tile tw"><span>power</span></div>
        </div>
        <div class="paper">
          <div class="rule"></div>
          <i>amazon return QR codes</i>
          <i>Neighbor payment</i>
          <i>re: Manus restoration</i>
          <div class="add">write in the margin…</div>
        </div>
      </div>
      <figcaption>
        <div class="num">01</div>
        <h2>Paper margin strip</h2>
        <p>Thin cream / letterhead band under the board, dark ink handwriting, hairline rule. Secondary — but readable.</p>
      </figcaption>
    </figure>

    <figure class="o2">
      <div class="stage">
        <div class="board">
          <div class="tile tb"><span>body</span></div>
          <div class="tile tp"><span>Pepperdine</span></div>
          <div class="tile tw"><span>power</span></div>
        </div>
        <div class="gutter">
          <i>amazon return</i>
          <i>neighbor pay</i>
          <i>manus restore</i>
        </div>
      </div>
      <figcaption>
        <div class="num">02</div>
        <h2>Side margin</h2>
        <p>True book gutter — narrow vertical column beside the day card, not under it.</p>
      </figcaption>
    </figure>

    <figure class="o3">
      <div class="stage">
        <div class="board">
          <div class="tile tb"><span>body</span></div>
          <div class="tile tp"><span>Pepperdine</span></div>
          <div class="tile tw"><span>power</span></div>
        </div>
        <div class="scraps">
          <div class="scrap">amazon return QR codes</div>
          <div class="scrap">Neighbor payment</div>
          <div class="scrap">re: Manus restoration</div>
        </div>
      </div>
      <figcaption>
        <div class="num">03</div>
        <h2>Floating scrap lines</h2>
        <p>Each one-off as a soft ripped-paper slip, slightly rotated — scrapbook, not a list app.</p>
      </figcaption>
    </figure>

    <figure class="o4">
      <div class="stage">
        <div class="board">
          <div class="tile tb"><span>body</span></div>
          <div class="tile tp"><span>Pepperdine</span></div>
          <div class="tile tw"><span>power</span></div>
        </div>
        <div class="ledger">
          <div class="row">amazon return QR codes</div>
          <div class="row">Neighbor payment</div>
          <div class="row">re: Manus restoration</div>
          <div class="row empty">write in the margin…</div>
        </div>
      </div>
      <figcaption>
        <div class="num">04</div>
        <h2>Hairline ledger</h2>
        <p>Continuous underline rows; type sits on the line like a journal. Empty ruled line = add.</p>
      </figcaption>
    </figure>

    <figure class="o5">
      <div class="stage" tabindex="0">
        <div class="board">
          <div class="tile tb"><span>body</span></div>
          <div class="tile tp"><span>Pepperdine</span></div>
          <div class="tile tw"><span>power</span></div>
        </div>
        <div class="ghost-zone">
          <div class="ghost-hint">hover near the edge</div>
          <div class="ghost-lines">
            <i>amazon return QR codes</i>
            <i>Neighbor payment</i>
            <i>re: Manus restoration</i>
          </div>
        </div>
      </div>
      <div class="hint-label" style="padding:0 16px 8px">hover / focus the stage above</div>
      <figcaption>
        <div class="num">05</div>
        <h2>Ghost until hover</h2>
        <p>Collage stays clean. Margin whispers in when you move near the bottom — or after “write in the margin.”</p>
      </figcaption>
    </figure>
  </div>

<script src="nav-shared.js?v=navalign3"></script>
</body>
</html>
