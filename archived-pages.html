<style>
  .page-bg {
    background:

      url("manus-storage/dashboard-hq-bg.jpg") center 48%/cover no-repeat;
    filter: saturate(0.75) brightness(0.72);
  }
  body.capture-page #hamburger-menu span { background: #f3e6d0; }
  body.capture-page .page-shell {
    max-width: 1180px;
    width: 100%;
    align-items: stretch;
    padding: 72px 24px 80px;
  }
  body.capture-page .hero { max-width: none; }
  body.capture-page .panel {
    width: 100%;
    max-width: none;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
  }
  .archive-empty {
    margin-top: 18px;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 17px;
    color: rgba(247,239,228,0.72);
    text-align: center;
  }
  .archive-overview {
    list-style: none;
    margin: 22px 0 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .archive-card {
    position: relative;
    display: block;
    aspect-ratio: 4 / 5;
    min-height: 260px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(247,239,228,0.22);
    box-shadow: 0 12px 32px rgba(0,0,0,0.38);
    background: #1a1410 center/cover no-repeat;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .archive-card:hover {
    transform: translateY(-2px);
    border-color: rgba(247,239,228,0.45);
  }
  .archive-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,8,6,0.12) 0%, rgba(10,8,6,0.2) 42%, rgba(8,6,4,0.82) 100%);
    pointer-events: none;
  }
  .archive-card .title {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 28px;
    z-index: 1;
    margin: 0;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(22px, 2.8vw, 32px);
    color: #f7efe4;
    text-shadow: 0 1px 12px rgba(0,0,0,0.55);
  }
  .archive-card .meta {
    position: absolute;
    left: 16px;
    right: 56px;
    bottom: 10px;
    z-index: 1;
    margin: 0;
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(247,239,228,0.7);
  }
  .archive-card .unarchive-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    margin: 0;
    padding: 7px 10px;
    border: 1px solid rgba(247,239,228,0.35);
    border-radius: 999px;
    background: rgba(12,9,7,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f7efe4;
    cursor: pointer;
  }
  .archive-card .unarchive-btn:hover {
    border-color: rgba(247,239,228,0.7);
    background: rgba(20,14,10,0.72);
  }
  .archive-card.no-photo {
    background: linear-gradient(160deg, rgba(60,42,28,0.95), rgba(20,14,10,0.98));
  }
  .status {
    margin-top: 18px;
    text-align: center;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(247,239,228,0.55);
  }
</style>

  <section class="panel">
    <ul class="archive-overview" id="list"></ul>
    <p class="archive-empty" id="empty">nothing archived yet</p>
    <p class="status" id="status">saved here</p>

      'transmutation.html': 'manus-storage/page-transmutation-bg.jpg?v=1',
      'victory-docket.html': 'manus-storage/victory-docket-bg.jpg?v=desk4'
  };
  function fileOf(href){
    return String(href || '').split('/').pop();
  }
  function load(){
    try {
      var raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch (e) { return []; }
  }
  function save(list){
    try { localStorage.setItem(KEY, JSON.stringify(list || [])); } catch (e) {}
  }
  function photoFor(it){
    if (!it) return '';
    var p = String(it.photo || '').trim();
    if (p) return p.replace(/^['"]|['"]$/g, '');
    var href = fileOf(it.href);
    return PAGE_PHOTO[href] || '';
  }
  function setStatus(msg){
    var el = document.getElementById('status');
    if (el) el.textContent = msg || 'saved here';
  }
  function unarchive(it){
    if (!it || !it.href) return;
    if (typeof window.__unarchiveNavPage === 'function') {
      window.__unarchiveNavPage(it.href, it.label);
    } else {
      var href = fileOf(it.href);
      save(load().filter(function(row){ return !(row && fileOf(row.href) === href); }));
    }
    setStatus((it.label || fileOf(it.href)) + ' · back in nav');
    render();
  }
  function render(){
    var items = load();
    var list = document.getElementById('list');
    var empty = document.getElementById('empty');
    list.innerHTML = '';
    items.forEach(function(it){
      if (!it || !it.href) return;
      var href = fileOf(it.href);
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'archive-card';
      a.href = href;
      var photo = photoFor(it);
      if (photo) a.style.backgroundImage = 'url("' + photo.replace(/"/g, '\\"') + '")';
      else a.classList.add('no-photo');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'unarchive-btn';
      btn.textContent = 'unarchive';
      btn.setAttribute('aria-label', 'unarchive ' + (it.label || href));
      btn.addEventListener('click', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        unarchive(it);
      });
      a.appendChild(btn);
      var title = document.createElement('p');
      title.className = 'title';
      title.textContent = it.label || href.replace(/\.html$/i, '');
      a.appendChild(title);
      var meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = 'archived page';
      a.appendChild(meta);
      li.appendChild(a);
      list.appendChild(li);
    });
    empty.hidden = items.length > 0;
  }
  render();
})();
</script>
