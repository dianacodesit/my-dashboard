<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>background images · diana's board</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@6..72,300;6..72,400;1,400&amp;family=DM+Mono:wght@300;400&amp;family=Italiana&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="nav-shared.css"/>
<style>
  :root { --cream:#F5F0E8; --paper:#FAF6EE; --ink:#2a2520; --muted:#6f5f54; --accent:#8a9e85; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body { font-family:'Newsreader', Georgia, serif; color:var(--ink); background:#1a1822; overflow-x:hidden; }
  .page-bg {
    position:fixed; inset:0; z-index:0;
    background:
      linear-gradient(165deg, rgba(26,24,34,0.55) 0%, rgba(38,32,48,0.42) 45%, rgba(22,20,28,0.62) 100%),
      url('manus-storage/deen-moodboard-bg_807e7166.jpg') center/cover no-repeat;
    filter: saturate(0.9) brightness(0.7);
  }
  .page-shell { position:relative; z-index:1; min-height:100vh; padding:72px 24px 48px; display:flex; justify-content:center; }
  .panel {
    width:min(860px,100%);
    background:rgba(250,246,238,0.94);
    border:1px solid rgba(196,168,130,0.35);
    border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,0.28);
    overflow:hidden;
  }
  .panel-header { padding:28px 32px 16px; border-bottom:1px solid rgba(196,168,130,0.22); }
  .eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  h1 { font-family:'Italiana',serif; font-size:clamp(30px,5vw,42px); font-weight:400; letter-spacing:0.03em; }
  .sub { margin-top:8px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.12em; color:var(--accent); }
  .panel-body { padding:20px 28px 28px; }
  .thumbs {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:14px;
  }
  .thumb {
    display:block;
    text-decoration:none;
    color:inherit;
  }
  .thumb img {
    display:block;
    width:100%;
    height:88px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid rgba(196,168,130,0.35);
    background:#1c140e;
  }
  .thumb p {
    margin-top:8px;
    font-family:'DM Mono',monospace;
    font-size:9px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .lightbox {
    display:none;
    position:fixed;
    inset:0;
    z-index:300000;
    background:rgba(8,4,2,0.86);
    align-items:center;
    justify-content:center;
    padding:28px;
  }
  .lightbox.open { display:flex; }
  .lightbox img {
    max-width:min(1100px, 100%);
    max-height:88vh;
    object-fit:contain;
    border-radius:8px;
  }
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<main class="page-shell">
  <article class="panel">
    <header class="panel-header">
      <p class="eyebrow">design preview</p>
      <h1>Background images</h1>
      <p class="sub">saved from pages · click a thumbnail to see it full</p>
    </header>
    <div class="panel-body">
      <div class="thumbs">
        <a class="thumb" href="manus-storage/thoughts-bg.jpg" data-full="manus-storage/thoughts-bg.jpg">
          <img src="manus-storage/thoughts-bg.jpg" alt="lamp night desk"/>
          <p>lamp · night desk</p>
        </a>
      </div>
    </div>
  </article>
</main>
<div class="lightbox" id="lightbox" aria-hidden="true"><img alt=""/></div>
<script src="nav-shared.js?v=timeblock"></script>
<script>
(function(){
  var box = document.getElementById('lightbox');
  var img = box.querySelector('img');
  document.querySelectorAll('.thumb').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      img.src = a.getAttribute('data-full');
      box.classList.add('open');
      box.setAttribute('aria-hidden','false');
    });
  });
  box.addEventListener('click', function(){
    box.classList.remove('open');
    box.setAttribute('aria-hidden','true');
    img.removeAttribute('src');
  });
})();
</script>
</body>
</html>
